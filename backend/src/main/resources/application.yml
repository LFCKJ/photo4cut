server:
  port: 8080

spring:
  application:
    name: ai-photobooth-service
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 80MB

ai:
  api:
    # 기본 AI 엔진: Google AI Studio (Gemini / Imagen 3)
    provider: ${AI_PROVIDER:google}
    google-api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    image-model: ${IMAGEN_MODEL:imagen-3.0-generate-002}
    provider-url: https://generativelanguage.googleapis.com/v1beta
