server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-http-form-post-size: 80MB
    max-swallow-size: 80MB

spring:
  application:
    name: ai-photobooth-service
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 80MB
  codec:
    max-in-memory-size: 50MB

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://*.vercel.app}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image-preview:generateContent

ai:
  api:
    provider: google
    google-api-key: ${GEMINI_API_KEY:}
    model: gemini-3.1-flash-image-preview
    provider-url: https://generativelanguage.googleapis.com/v1beta
