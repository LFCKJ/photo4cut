version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: photo4cut-backend
    restart: unless-stopped
    environment:
      - PORT=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://*.vercel.app}
      - APP_PUBLIC_BASE_URL=${APP_PUBLIC_BASE_URL:-}
    networks:
      - photo-net
    # 로컬 테스트 시에는 포트 8080을 직접 노출할 수도 있음
    ports:
      - "8080:8080"

  nginx:
    image: nginx:alpine
    container_name: photo4cut-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - photo-net

networks:
  photo-net:
    driver: bridge
